# Interactive path tracing with stochastic refracted-light caustics.
renderer_backend=compute
shading_mode=path_tracing
path_tracer_bounce_budget=5
swap_interval=0
display_exposure=1.0
path_tracer_ambient=0.02
raster_ambient=0.03
point_light_power=300.0
directional_light_power=2.0
accumulation_enabled=true
subsurface_enabled=false
caustics_enabled=true
caustic_photon_count=65536
